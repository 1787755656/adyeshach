name: adyeshach Release

on:
  repository_dispatch:
  workflow_dispatch:
  #push:
   # branches: [ "rebirth" ]
 # pull_request:
  #  branches: [ "rebirth" ]

jobs:
  releaseJar:
    runs-on: ubuntu-20.04
    steps:
      - uses:  actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
#      - name: Build with Gradle
#        run: ./gradlew build

      # First build
      - name: build
        id: build_1
        run: ./gradlew clean build
      # Second build
      - name: build (retry 1)
        id: build_2
        if: steps.build_1.outcome == 'failure'
        run: ./gradlew clean build
       # Third build
      - name: build (retry 2)
        id: build_3
        if: steps.build_2.outcome == 'failure'
        run: ./gradlew clean build
       # Fourth build
      - name: build (retry 3)
        id: build_4
        if: steps.build_3.outcome == 'failure'
        run: ./gradlew clean build
      - name: Verify Build Outputs
        run: |
          echo "根项目构建产物："
          ls -l build/libs
          echo "子模块构建产物："
          find . -path "*/build/libs/*.jar" -exec ls -l {} \;

        # output jar
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v2
        with:
          name: adyeshach Release
          #path: build/libs/*.jar
          path: "**/build/libs/*.jar"
